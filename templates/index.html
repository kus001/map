<!DOCTYPE html>

<html>
    <head>
        <title>Map</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <style>
            #map {
                width: 100%;
                height: 600px;
            }
        </style>
    </head>
    <body>
        <h1>Driving Router</h1>
        <input id="start" placeholder="Starting location">
        <input id="destination" placeholder="Destination">
        <button id="search-button">Find routes</button>
        <div id="map"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            const map = L.map("map").setView([43.4643, -80.5204], 12);
            
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "&copy; OpenStreetMap contriubutors"}).addTo(map);
            
            let routeLayers = [];
            let startMarker = null;
            let endMarker = null;
            let currentData = null;
            let selectedRouteNumber = 1;


            const searchButton = document.getElementById("search-button");
            
            searchButton.addEventListener("click", async function() {
                const start = document.getElementById("start").value;
                const destination = document.getElementById("destination").value;
                const response = await fetch("/api/routes", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({
                        start: start,
                        destination: destination
                    })
                });
                const data = await response.json();

                if (!data.success) {
                    alert(data.error);
                    return;
                }
                
                routeLayers.forEach(function(layer) {
                    map.removeLayer(layer);
                });

                routeLayers = [];

                if (startMarker !== null) {
                    map.removeLayer(startMarker);
                }

                if (endMarker !== null) {
                    map.removeLayer(endMarker);
                }

                currentData = data;
                selectedRouteNumber = data.fastest_route_number;
                const selectedRoute = drawRoutes();

                startMarker = L.marker(
                    data.start.coordinates
                ).addTo(map);

                startMarker.bindPopup(
                    "Start: " + data.start.address
                );

                endMarker = L.marker(
                    data.end.coordinates
                ).addTo(map);

                endMarker.bindPopup(
                    "Destination: " + data.end.address
                );

                map.fitBounds(selectedRoute.route_coordinates);
            });

            function drawRoutes() {
                routeLayers.forEach(function(layer) {
                    map.removeLayer(layer);
                });
                routeLayers = [];

                currentData.routes.forEach(
                    function(route) {
                        if (route.route_number !== selectedRouteNumber) {
                            const line = L.polyline(route.route_coordinates, {
                                color: "#777777",
                                weight: 4,
                                opacity: 0.4
                            }).addTo(map);
                            line.on("click", function() {
                                selectedRouteNumber = route.route_number;
                                drawRoutes();
                            });
                            routeLayers.push(line);
                        }
                    }
                );

                const selectedRoute = currentData.routes.find(function(route) {
                    return (
                        route.route_number === selectedRouteNumber
                    );
                });

                const selectedLine = L.polyline(selectedRoute.route_coordinates, {
                    color: "#2563eb",
                    weight: 7,
                    opacity: 0.9
                }).addTo(map);
                routeLayers.push(selectedLine);

                return selectedRoute;
            }            
        </script>
    </body>
</html>
